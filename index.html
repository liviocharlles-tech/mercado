<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Feira do Mês — Controle de Compras</title>

<!-- PWA: instalar na tela inicial do celular -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2E4F35">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Feira do Mês">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsqr/1.4.0/jsQR.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --bg:#F3F4F1;
    --surface:#FFFFFF;
    --surface-2:#F7F8F5;
    --ink:#1B1E19;
    --ink-soft:#6B7066;
    --ink-faint:#9BA097;
    --green:#1F6B45;
    --green-dark:#175236;
    --green-tint:#E7F3EB;
    --mango:#E08A2B;
    --mango-tint:#FCEEDC;
    --red:#D14343;
    --red-tint:#FBE9E9;
    --line:#E7E8E3;
    --shadow-sm:0 1px 2px rgba(20,22,18,0.06);
    --shadow-md:0 4px 16px rgba(20,22,18,0.08);
    --shadow-lg:0 12px 32px rgba(20,22,18,0.14);
    --radius:16px;
    --radius-sm:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Manrope',sans-serif;
    -webkit-font-smoothing:antialiased;
    font-feature-settings:'tnum' 1;
  }
  #app{
    max-width:520px;margin:0 auto;min-height:100vh;background:var(--surface);
    box-shadow:var(--shadow-lg);
    position:relative;
  }
  @media (min-width:521px){
    body{padding:24px 0;}
    #app{min-height:calc(100vh - 48px);border-radius:24px;overflow:hidden;}
  }
  .num{font-variant-numeric:tabular-nums;}

  header.receipt-head{
    padding:24px 22px 18px;
    background:linear-gradient(135deg,var(--green) 0%,var(--green-dark) 100%);
    color:#fff;
    position:relative;
  }
  header.receipt-head h1{
    margin:0;
    font-size:21px;
    letter-spacing:-0.2px;
    font-weight:800;
    color:#fff;
    display:flex;align-items:center;gap:8px;
  }
  header.receipt-head h1::before{
    content:'🛒';font-size:19px;
  }
  header.receipt-head .sub{
    margin-top:4px;
    font-size:12.5px;
    color:rgba(255,255,255,0.75);
  }
  .userbar{
    margin-top:16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
  }
  .userbar .who{
    font-size:13px;
    color:#fff;
  }
  .userbar .who b{font-weight:800;}
  .userbar .who .tag{
    display:inline-block;margin-left:6px;padding:2px 8px;
    background:var(--mango);color:#fff;border-radius:999px;font-size:10px;
    font-weight:800;letter-spacing:0.4px;
  }
  .linkbtn{
    background:none;border:none;color:var(--ink-soft);
    text-decoration:none;cursor:pointer;font-size:12.5px;padding:0;
    font-family:'Manrope';font-weight:700;
  }
  .userbar .linkbtn{color:rgba(255,255,255,0.85);}
  .linkbtn:hover{text-decoration:underline;}

  nav#tabs{
    display:flex;overflow-x:auto;gap:4px;
    background:var(--surface);
    padding:10px 14px;border-bottom:1px solid var(--line);
    -ms-overflow-style:none;scrollbar-width:none;
  }
  nav#tabs::-webkit-scrollbar{display:none;}
  nav#tabs button{
    flex:0 0 auto;
    padding:8px 14px;
    background:transparent;border:none;border-radius:999px;
    font-family:'Manrope';font-weight:700;font-size:12.5px;
    color:var(--ink-soft);cursor:pointer;white-space:nowrap;
    transition:background .15s ease, color .15s ease;
  }
  nav#tabs button:hover{background:var(--surface-2);}
  nav#tabs button.active{
    color:#fff;background:var(--green);
  }

  main#view{padding:20px 20px 90px;}

  h2.section-title{
    font-size:17px;margin:0 0 4px;color:var(--ink);
    font-weight:800;letter-spacing:-0.2px;
  }
  p.section-hint{
    font-size:13px;color:var(--ink-soft);margin:0 0 18px;line-height:1.55;
  }

  .card{
    border:1px solid var(--line);
    background:var(--surface);
    border-radius:var(--radius-sm);
    padding:14px 16px;
    margin-bottom:10px;
    box-shadow:var(--shadow-sm);
    transition:box-shadow .15s ease;
  }
  .card .row-top{
    display:flex;justify-content:space-between;align-items:flex-start;gap:10px;
  }
  .card .title{font-weight:700;font-size:14.5px;color:var(--ink);}
  .card .meta{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .card .price{font-weight:800;color:var(--green);font-size:14.5px;white-space:nowrap;}
  .card .actions{display:flex;gap:8px;margin-top:12px;}
  .card .actions button{
    font-size:11.5px;border:1px solid var(--line);background:var(--surface-2);
    padding:6px 12px;cursor:pointer;font-family:'Manrope';font-weight:700;color:var(--ink);
    border-radius:999px;transition:background .15s ease;
  }
  .card .actions button:hover{background:var(--line);}
  .card .actions button.danger{color:var(--red);border-color:var(--red-tint);background:var(--red-tint);}
  .card .actions button.danger:hover{background:#f5d4d4;}
  .card .actions button.primary{color:var(--green);border-color:var(--green-tint);background:var(--green-tint);}

  form.form-block{
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px;margin-bottom:18px;background:var(--surface-2);
  }
  form.form-block .field{margin-bottom:12px;}
  form.form-block label{
    display:block;font-size:11.5px;text-transform:none;color:var(--ink-soft);
    margin-bottom:5px;font-weight:700;
  }
  form.form-block input, form.form-block select{
    width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);
    background:#fff;font-family:'Manrope';font-size:14px;color:var(--ink);
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  form.form-block input:focus, form.form-block select:focus{
    outline:none;border-color:var(--green);box-shadow:0 0 0 3px var(--green-tint);
  }
  form.form-block .field-row{display:flex;gap:10px;}
  form.form-block .field-row .field{flex:1;}
  .btn{
    display:inline-block;padding:11px 18px;background:var(--green);color:#fff;
    border:none;border-radius:999px;cursor:pointer;font-family:'Manrope';font-weight:800;font-size:13.5px;
    box-shadow:var(--shadow-sm);transition:transform .1s ease, box-shadow .15s ease, background .15s ease;
  }
  .btn:hover{background:var(--green-dark);box-shadow:var(--shadow-md);}
  .btn:active{transform:scale(0.98);}
  .btn.secondary{background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:none;}
  .btn.secondary:hover{background:var(--surface-2);}
  .btn.warn{background:var(--red);}
  .btn.warn:hover{background:#b53535;}
  .btn:disabled{opacity:0.4;cursor:not-allowed;transform:none;box-shadow:none;}
  .btn:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible{
    outline:2px solid var(--mango);outline-offset:2px;
  }

  .empty{
    padding:34px 18px;text-align:center;color:var(--ink-soft);
    border:1.5px dashed var(--line);border-radius:var(--radius);font-size:13.5px;
    background:var(--surface-2);
  }

  .total-strip{
    position:sticky;bottom:14px;left:0;right:0;
    background:linear-gradient(135deg,var(--green) 0%,var(--green-dark) 100%);
    color:#fff;border-radius:var(--radius);
    padding:16px 20px;margin:20px 0 -70px;
    display:flex;justify-content:space-between;align-items:center;
    box-shadow:var(--shadow-lg);
  }
  .total-strip .lbl{font-size:12px;opacity:0.8;}
  .total-strip .val{font-size:23px;font-weight:800;letter-spacing:-0.3px;}

  table.receipt-table{width:100%;border-collapse:collapse;margin-top:10px;}
  table.receipt-table th{
    text-align:left;font-size:10.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:0.4px;
    border-bottom:1px solid var(--line);padding:6px 4px 8px;font-weight:700;
  }
  table.receipt-table td{
    font-size:13px;padding:10px 4px;border-bottom:1px solid var(--line);
    vertical-align:middle;
  }
  table.receipt-table td.qtd input{width:56px;padding:6px;border:1px solid var(--line);border-radius:8px;text-align:center;}
  table.receipt-table td.num{white-space:nowrap;font-weight:700;}
  table.receipt-table td .rm{background:var(--red-tint);border:none;color:var(--red);cursor:pointer;font-size:14px;padding:4px 8px;border-radius:999px;line-height:1;}

  .pill{
    display:inline-block;padding:3px 10px;border:1px solid var(--line);border-radius:999px;
    font-size:10.5px;color:var(--ink-soft);margin-right:4px;background:var(--surface-2);
  }

  .qr-box{
    border:1.5px dashed var(--line);border-radius:var(--radius);padding:20px;text-align:center;margin-bottom:16px;
    background:var(--surface-2);
  }
  video#qr-video{width:100%;max-width:400px;border-radius:var(--radius-sm);margin-top:12px;box-shadow:var(--shadow-md);}
  .qr-result{
    border:1px solid var(--green-tint);background:var(--green-tint);border-radius:var(--radius-sm);padding:14px;font-size:12.5px;
    word-break:break-all;margin-top:10px;
  }
  .notice{
    font-size:11.5px;color:var(--ink-soft);background:var(--mango-tint);border-radius:var(--radius-sm);
    border-left:3px solid var(--mango);padding:10px 12px;margin-top:8px;line-height:1.5;
  }
  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:10px 18px;font-size:12.5px;
    border-radius:999px;z-index:50;max-width:90%;text-align:center;box-shadow:var(--shadow-lg);
  }
  .install-bar{
    background:var(--mango-tint);color:var(--ink);padding:10px 18px;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    font-size:12px;border-bottom:1px solid var(--line);
  }
  .install-bar b{font-weight:800;}
  .install-bar .btn{background:var(--mango);color:#fff;box-shadow:none;padding:6px 14px;}
  .install-bar .linkbtn{color:var(--ink-soft);text-decoration:underline;}
</style>
</head>
<body>
<div id="app">
  <header class="receipt-head">
    <h1>Feira do Mês</h1>
    <div class="sub">Compras compartilhadas · Região Metropolitana do Recife</div>
    <div class="userbar" id="userbar"></div>
  </header>
  <div id="install-bar" class="install-bar" style="display:none"></div>
  <nav id="tabs"></nav>
  <main id="view"></main>
</div>

<script>
/* ---------------------------------------------------------
   Utilidades
--------------------------------------------------------- */
const $ = sel => document.querySelector(sel);
const fmtBRL = n => (Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function esc(s){ return String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg){
  const t=document.createElement('div');t.className='toast';t.textContent=msg;
  document.body.appendChild(t);setTimeout(()=>t.remove(),2200);
}

/* Conexão com o Supabase (projeto "liviocharlles-tech's Project", schema "feira") */
const SUPABASE_URL = 'https://wzfstallegpihgihiefg.supabase.co';
const SUPABASE_KEY = 'sb_publishable_TcrH8oRXCNM3x_AMbK9MPA_p9Mt4nRn';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function dbErr(label, error){
  console.error(label, error);
  toast('Erro no banco (' + label + '): ' + (error?.message || 'falha desconhecida'));
}

const CATEGORIAS = ['Hortifruti','Açougue e Carnes','Laticínios e Frios','Padaria','Mercearia','Bebidas','Congelados','Limpeza','Higiene e Beleza','Pet','Outros'];
const UNIDADES = ['kg','g','L','ml','un','dz','pct','cx'];
const CIDADES_RMR = ['Recife','Olinda','Paulista','Jaboatão dos Guararapes','Camaragibe','São Lourenço da Mata','Cabo de Santo Agostinho','Igarassu','Abreu e Lima','Ipojuca','Moreno','Araçoiaba','Itapissuma','Itamaracá'];

/* ---------------------------------------------------------
   Estado
--------------------------------------------------------- */
let state = {
  tab: 'compra',
  usuarios: [],
  mercados: [],
  produtos: [],
  compraAtual: null,   // {id, mercadoId, criadoEm, itens:[], status}
  historico: [],
  authUser: null,       // sessão do Supabase Auth (auth.users)
  authMode: 'entrar',   // 'entrar' | 'cadastro'
  sessionUser: null,    // linha correspondente em feira.usuarios
  editing: {mercado:null, produto:null, usuario:null},
};

async function loadAll(){
  const [u, m, p] = await Promise.all([
    sb.from('feira_usuarios').select('*').order('criado_em'),
    sb.from('feira_mercados').select('*').order('nome'),
    sb.from('feira_produtos').select('*').order('nome'),
  ]);
  if(u.error) dbErr('usuarios', u.error); else state.usuarios = u.data.map(mapUsuario);
  if(m.error) dbErr('mercados', m.error); else state.mercados = m.data.map(mapMercado);
  if(p.error) dbErr('produtos', p.error); else state.produtos = p.data.map(mapProduto);

  const compraAberta = await sb.from('feira_compras').select('*').eq('status','aberta').order('criado_em',{ascending:false}).limit(1);
  if(compraAberta.error){ dbErr('compra atual', compraAberta.error); }
  else if(compraAberta.data.length){
    const c = compraAberta.data[0];
    const itens = await sb.from('feira_itens_compra').select('*').eq('compra_id', c.id).order('criado_em');
    state.compraAtual = {
      id:c.id, mercadoId:c.mercado_id, criadoEm:c.criado_em, status:c.status,
      itens: (itens.data||[]).map(mapItem)
    };
  } else {
    state.compraAtual = null;
  }

  const hist = await sb.from('feira_compras').select('*, feira_mercados(nome)').eq('status','finalizada').order('finalizada_em',{ascending:false}).limit(50);
  if(hist.error){ dbErr('histórico', hist.error); state.historico = []; }
  else {
    state.historico = await Promise.all(hist.data.map(async c=>{
      const itens = await sb.from('feira_itens_compra').select('*').eq('compra_id', c.id);
      const mapped = (itens.data||[]).map(mapItem);
      return {
        id:c.id, mercadoId:c.mercado_id, mercadoNome:(c.feira_mercados&&c.feira_mercados.nome)||'—',
        criadoEm:c.criado_em, finalizadaEm:c.finalizada_em, itens:mapped,
        total: mapped.reduce((s,it)=>s+it.precoUnit*it.quantidade,0)
      };
    }));
  }
}
function mapUsuario(u){ return {id:u.id, nome:u.nome, admin:u.admin}; }
function mapMercado(m){ return {id:m.id, nome:m.nome, bairro:m.bairro, cidade:m.cidade}; }
function mapProduto(p){ return {id:p.id, nome:p.nome, categoria:p.categoria, unidade:p.unidade, preco:Number(p.preco)}; }
function mapItem(it){ return {id:it.id, produtoId:it.produto_id, nome:it.nome, unidade:it.unidade, precoUnit:Number(it.preco_unit), quantidade:Number(it.quantidade), adicionadoPor:it.adicionado_por}; }

/* ---------------------------------------------------------
   Bootstrap / render loop
--------------------------------------------------------- */
async function init(){
  const {data} = await sb.auth.getSession();
  if(data.session){
    state.authUser = data.session.user;
    await loadAll();
    await checarPerfil();
  }
  render();
  setInterval(async ()=>{
    const ae = document.activeElement;
    const editando = ae && ['INPUT','SELECT','TEXTAREA'].includes(ae.tagName) && document.getElementById('app').contains(ae);
    if(editando) return; // não atualiza a tela enquanto alguém está digitando, para não apagar o que foi escrito
    if(!state.authUser) return;
    await loadAll();
    render(true);
  }, 4000);
}

function render(silent){
  renderUserbar();
  renderTabs();
  if(!state.sessionUser){
    renderLogin();
    return;
  }
  const view = $('#view');
  switch(state.tab){
    case 'compra': renderCompra(view); break;
    case 'mercados': renderMercados(view); break;
    case 'produtos': renderProdutos(view); break;
    case 'usuarios': renderUsuarios(view); break;
    case 'historico': renderHistorico(view); break;
    case 'qr': renderQR(view); break;
    default: renderCompra(view);
  }
}

function setTab(t){ state.tab = t; render(); }

/* ---------------------------------------------------------
   Login (Supabase Auth: e-mail + senha)
--------------------------------------------------------- */
function renderUserbar(){
  const bar = $('#userbar');
  if(!state.sessionUser){ bar.innerHTML=''; return; }
  bar.innerHTML = `
    <div class="who">Olá, <b>${esc(state.sessionUser.nome)}</b>${state.sessionUser.admin?'<span class="tag">ADMIN</span>':''}</div>
    <button class="linkbtn" onclick="logout()">sair</button>
  `;
}
async function logout(){
  await sb.auth.signOut();
  state.sessionUser=null; state.authUser=null; state.tab='compra';
  render();
}

function renderTabs(){
  const tabs = $('#tabs');
  if(!state.sessionUser){ tabs.innerHTML=''; return; }
  const items = [
    ['compra','Compra atual'],
    ['mercados','Mercados'],
    ['produtos','Produtos'],
    ['historico','Histórico'],
    ['qr','Ler nota (QR)'],
  ];
  if(state.sessionUser.admin) items.push(['usuarios','Usuários']);
  tabs.innerHTML = items.map(([k,l])=>`<button class="${state.tab===k?'active':''}" onclick="setTab('${k}')">${l}</button>`).join('');
}

function renderLogin(){
  const view = $('#view');

  // Caso 1: sem sessão de conta nenhuma -> entrar ou criar conta
  if(!state.authUser){
    view.innerHTML = `
      <h2 class="section-title">${state.authMode==='cadastro'?'Criar conta':'Entrar'}</h2>
      <p class="section-hint">Acesso com e-mail e senha reais (Supabase Auth). Só quem tiver uma conta cadastrada e liberada pelo administrador consegue ver ou alterar os dados.</p>
      <form class="form-block" onsubmit="return ${state.authMode==='cadastro'?'criarConta(event)':'entrar(event)'}">
        <div class="field"><label>E-mail</label><input required type="email" id="au-email" placeholder="voce@exemplo.com"></div>
        <div class="field"><label>Senha</label><input required type="password" minlength="6" id="au-senha" placeholder="mínimo 6 caracteres"></div>
        <button class="btn" type="submit">${state.authMode==='cadastro'?'Criar conta':'Entrar'}</button>
      </form>
      <button class="linkbtn" onclick="alternarModoAuth()">${state.authMode==='cadastro'?'Já tenho conta, quero entrar':'Ainda não tenho conta, quero me cadastrar'}</button>
      <div class="notice">${state.authMode==='cadastro'
        ? 'Depois de criar a conta, o Supabase pode pedir confirmação por e-mail antes do primeiro acesso — confira sua caixa de entrada (e o spam).'
        : 'Esqueceu a senha? Peça ao administrador para te ajudar a redefinir pelo painel do Supabase por enquanto.'}</div>
    `;
    return;
  }

  // Caso 2: tem conta autenticada, mas ainda não completou o cadastro (nome) no app
  view.innerHTML = `
    <h2 class="section-title">Complete seu cadastro</h2>
    <p class="section-hint">Sua conta (${esc(state.authUser.email)}) está autenticada. Falta só o seu nome para aparecer nas listas de compra.</p>
    <form class="form-block" onsubmit="return completarCadastro(event)">
      <div class="field"><label>Seu nome</label><input required id="cc-nome" placeholder="Ex.: Lívio"></div>
      <button class="btn" type="submit">Concluir</button>
    </form>
    <button class="linkbtn" onclick="logout()">sair desta conta</button>
  `;
}
function alternarModoAuth(){ state.authMode = state.authMode==='cadastro' ? 'entrar' : 'cadastro'; render(); }

async function criarConta(e){
  e.preventDefault();
  const email = $('#au-email').value.trim();
  const senha = $('#au-senha').value;
  const {data, error} = await sb.auth.signUp({email, password: senha});
  if(error){ dbErr('criar conta', error); return false; }
  if(!data.session){
    toast('Conta criada! Confirme seu e-mail e depois entre normalmente.');
    state.authMode='entrar';
    render();
    return false;
  }
  state.authUser = data.user;
  render();
  return false;
}
async function entrar(e){
  e.preventDefault();
  const email = $('#au-email').value.trim();
  const senha = $('#au-senha').value;
  const {data, error} = await sb.auth.signInWithPassword({email, password: senha});
  if(error){ dbErr('entrar', error); return false; }
  state.authUser = data.user;
  await checarPerfil();
  render();
  return false;
}
async function completarCadastro(e){
  e.preventDefault();
  const nome = $('#cc-nome').value.trim();
  if(!nome) return false;
  const {count} = await sb.from('feira_usuarios').select('*', {count:'exact', head:true});
  const admin = (count||0) === 0;
  const {data, error} = await sb.from('feira_usuarios').insert({id: state.authUser.id, nome, admin}).select().single();

/* ---------------------------------------------------------
   Leitor de QR Code (notas fiscais anteriores)
--------------------------------------------------------- */
let qrStream = null, qrLoopId = null;

function renderQR(view){
  view.innerHTML = `
    <h2 class="section-title">Ler QR Code de nota anterior</h2>
    <p class="section-hint">Aponte a câmera para o QR Code da nota (NFC-e) ou envie uma foto. O código traz o link e a chave de acesso da nota na Sefaz.</p>

    <div class="qr-box">
      <button class="btn" onclick="iniciarCamera()">Usar câmera</button>
      <input type="file" accept="image/*" id="qr-file" style="margin-top:10px" onchange="lerArquivoQR(event)">
      <div><video id="qr-video" playsinline style="display:none"></video></div>
      <canvas id="qr-canvas" style="display:none"></canvas>
    </div>

    <div id="qr-output"></div>

    <div class="notice">
      Sites de Sefaz normalmente bloqueiam o carregamento automático dos itens da nota por outros aplicativos (bloqueio de origem cruzada). Este leitor decodifica o QR Code e mostra o link e a chave de acesso — abra o link para conferir os produtos e cadastre-os manualmente na aba Produtos ou direto na Compra atual.
    </div>
  `;
}

async function iniciarCamera(){
  const video = $('#qr-video');
  try{
    qrStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
  }catch(e){
    toast('Não foi possível acessar a câmera: '+e.message);
    return;
  }
  video.srcObject = qrStream;
  video.style.display = 'block';
  await video.play();
  const canvas = $('#qr-canvas');
  const ctx = canvas.getContext('2d', {willReadFrequently:true});
  function tick(){
    if(video.readyState === video.HAVE_ENOUGH_DATA){
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const img = ctx.getImageData(0,0,canvas.width,canvas.height);
      const code = window.jsQR ? jsQR(img.data, img.width, img.height) : null;
      if(code){
        pararCamera();
        mostrarResultadoQR(code.data);
        return;
      }
    }
    qrLoopId = requestAnimationFrame(tick);
  }
  tick();
}
function pararCamera(){
  if(qrLoopId) cancelAnimationFrame(qrLoopId);
  if(qrStream) qrStream.getTracks().forEach(t=>t.stop());
  qrStream=null; qrLoopId=null;
  const video = $('#qr-video');
  if(video) video.style.display='none';
}
function lerArquivoQR(e){
  const file = e.target.files[0];
  if(!file) return;
  const img = new Image();
  const reader = new FileReader();
  reader.onload = ev => {
    img.onload = () => {
      const canvas = $('#qr-canvas');
      canvas.width = img.width; canvas.height = img.height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img,0,0);
      const data = ctx.getImageData(0,0,canvas.width,canvas.height);
      const code = window.jsQR ? jsQR(data.data, data.width, data.height) : null;
      if(code) mostrarResultadoQR(code.data);
      else toast('Não foi possível ler um QR Code nessa imagem.');
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}
function mostrarResultadoQR(texto){
  const chave = (texto.match(/[?&]p=(\d{44})/) || texto.match(/(\d{44})/) || [])[1];
  const out = $('#qr-output');
  out.innerHTML = `
    <div class="qr-result">
      <div><b>Conteúdo lido:</b></div>
      <div style="margin:6px 0">${esc(texto)}</div>
      ${chave ? `<div><b>Chave de acesso:</b> ${esc(chave)}</div>` : ''}
      ${/^https?:\/\//.test(texto) ? `<a href="${esc(texto)}" target="_blank" rel="noopener">Abrir nota em nova aba →</a>` : ''}
    </div>
  `;
}

/* ---------------------------------------------------------
   Instalar como app (PWA)
--------------------------------------------------------- */
let deferredInstallPrompt = null;
let installDismissed = false;

function isStandalone(){
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
}
function isIOS(){
  return /iphone|ipad|ipod/i.test(navigator.userAgent);
}
function renderInstallBar(){
  const el = document.getElementById('install-bar');
  if(!el) return;
  if(installDismissed || isStandalone()){ el.style.display='none'; el.innerHTML=''; return; }
  if(deferredInstallPrompt){
    el.style.display='flex';
    el.innerHTML = `<span>Instale o <b>Feira do Mês</b> na tela inicial do celular.</span>
      <span style="display:flex;gap:10px;align-items:center;white-space:nowrap">
        <button class="btn" style="padding:6px 12px" onclick="instalarApp()">Instalar</button>
        <button class="linkbtn" onclick="dismissInstallBar()">agora não</button>
      </span>`;
  } else if(isIOS()){
    el.style.display='flex';
    el.innerHTML = `<span>Para instalar: toque em <b>Compartilhar</b> e depois em <b>"Adicionar à Tela de Início"</b>.</span>
      <button class="linkbtn" onclick="dismissInstallBar()">ok</button>`;
  } else {
    el.style.display='none';
  }
}
function dismissInstallBar(){ installDismissed = true; renderInstallBar(); }
async function instalarApp(){
  if(!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice;
  deferredInstallPrompt = null;
  renderInstallBar();
}
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredInstallPrompt = e;
  renderInstallBar();
});
window.addEventListener('appinstalled', ()=>{
  deferredInstallPrompt = null;
  renderInstallBar();
});
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}

/* ---------------------------------------------------------
   Start
--------------------------------------------------------- */
init();
renderInstallBar();
