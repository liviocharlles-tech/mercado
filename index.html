<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Feira do Mês — Controle de Compras</title>

<!-- PWA: instalar na tela inicial do celular -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2E4F35">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Feira do Mês">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --bg:#F3F4F1;
    --surface:#FFFFFF;
    --surface-2:#F7F8F5;
    --ink:#1B1E19;
    --ink-soft:#6B7066;
    --ink-faint:#9BA097;
    --green:#1F6B45;
    --green-dark:#175236;
    --green-tint:#E7F3EB;
    --mango:#E08A2B;
    --mango-tint:#FCEEDC;
    --red:#D14343;
    --red-tint:#FBE9E9;
    --line:#E7E8E3;
    --shadow-sm:0 1px 2px rgba(20,22,18,0.06);
    --shadow-md:0 4px 16px rgba(20,22,18,0.08);
    --shadow-lg:0 12px 32px rgba(20,22,18,0.14);
    --radius:16px;
    --radius-sm:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Manrope',sans-serif;
    -webkit-font-smoothing:antialiased;
    font-feature-settings:'tnum' 1;
  }
  #app{
    width:100%;min-height:100vh;background:var(--surface);
    position:relative;
  }
  nav#tabs{max-width:820px;margin:0 auto;}
  main#view{max-width:820px;margin:0 auto;}
  #install-bar{max-width:820px;margin:0 auto;}
  .num{font-variant-numeric:tabular-nums;}

  header.receipt-head{
    padding:24px 22px 18px;
    background:linear-gradient(135deg,var(--green) 0%,var(--green-dark) 100%);
    color:#fff;
    position:relative;
  }
  .header-inner{max-width:820px;margin:0 auto;}
  header.receipt-head h1{
    margin:0;
    font-size:21px;
    letter-spacing:-0.2px;
    font-weight:800;
    color:#fff;
    display:flex;align-items:center;gap:8px;
  }
  header.receipt-head h1::before{
    content:'🛒';font-size:19px;
  }
  header.receipt-head .sub{
    margin-top:4px;
    font-size:12.5px;
    color:rgba(255,255,255,0.75);
  }
  .userbar{
    margin-top:16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
  }
  .userbar .who{
    font-size:13px;
    color:#fff;
  }
  .userbar .who b{font-weight:800;}
  .userbar .who .tag{
    display:inline-block;margin-left:6px;padding:2px 8px;
    background:var(--mango);color:#fff;border-radius:999px;font-size:10px;
    font-weight:800;letter-spacing:0.4px;
  }
  .linkbtn{
    background:none;border:none;color:var(--ink-soft);
    text-decoration:none;cursor:pointer;font-size:12.5px;padding:0;
    font-family:'Manrope';font-weight:700;
  }
  .userbar .linkbtn{color:rgba(255,255,255,0.85);}
  .linkbtn:hover{text-decoration:underline;}

  nav#tabs{
    display:flex;overflow-x:auto;gap:4px;
    background:var(--surface);
    padding:10px 14px;border-bottom:1px solid var(--line);
    -ms-overflow-style:none;scrollbar-width:none;
  }
  nav#tabs::-webkit-scrollbar{display:none;}
  nav#tabs button{
    flex:0 0 auto;
    padding:8px 14px;
    background:transparent;border:none;border-radius:999px;
    font-family:'Manrope';font-weight:700;font-size:12.5px;
    color:var(--ink-soft);cursor:pointer;white-space:nowrap;
    transition:background .15s ease, color .15s ease;
  }
  nav#tabs button:hover{background:var(--surface-2);}
  nav#tabs button.active{
    color:#fff;background:var(--green);
  }

  main#view{padding:20px 20px 90px;}
  @media (min-width:521px){
    main#view{padding:26px 32px 90px;}
  }
  #back-bar:empty{display:none;}
  .back-btn{
    background:none;border:none;cursor:pointer;color:var(--green);
    font-family:'Manrope';font-weight:800;font-size:13px;padding:0 0 14px;
    display:flex;align-items:center;gap:4px;
  }
  .back-btn:hover{text-decoration:underline;}

  .picker-btn{
    width:100%;display:flex;align-items:center;gap:10px;
    padding:8px 10px;border:1px solid var(--line);border-radius:var(--radius-sm);
    background:#fff;cursor:pointer;font-family:'Manrope';font-size:13.5px;color:var(--ink);
  }
  .picker-list{
    border:1px solid var(--line);border-radius:var(--radius-sm);margin-top:6px;
    max-height:280px;overflow-y:auto;background:#fff;box-shadow:var(--shadow-md);
  }
  .picker-item{
    display:flex;align-items:center;gap:10px;padding:9px 10px;cursor:pointer;
    border-bottom:1px solid var(--line);
  }
  .picker-item:last-child{border-bottom:none;}
  .picker-item:hover{background:var(--surface-2);}
  .picker-placeholder{color:var(--mango);font-weight:700;}
  .picker-search{
    width:100%;border:none;border-bottom:1px solid var(--line);padding:10px 12px;
    font-family:'Manrope';font-size:13.5px;background:var(--surface-2);
    position:sticky;top:0;z-index:1;
  }
  .picker-search:focus{outline:none;background:#fff;}
  .presenca-bar{
    background:var(--green-tint);color:var(--green-dark);
    border-radius:999px;padding:6px 14px;font-size:12px;
    display:inline-block;margin-bottom:14px;
  }

  h2.section-title{
    font-size:17px;margin:0 0 4px;color:var(--ink);
    font-weight:800;letter-spacing:-0.2px;
  }
  p.section-hint{
    font-size:13px;color:var(--ink-soft);margin:0 0 18px;line-height:1.55;
  }

  .card{
    border:1px solid var(--line);
    background:var(--surface);
    border-radius:var(--radius-sm);
    padding:14px 16px;
    margin-bottom:10px;
    box-shadow:var(--shadow-sm);
    transition:box-shadow .15s ease;
  }
  .card .row-top{
    display:flex;justify-content:space-between;align-items:flex-start;gap:10px;
  }
  .card .title{font-weight:700;font-size:14.5px;color:var(--ink);}
  .card .meta{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .card .price{font-weight:800;color:var(--green);font-size:14.5px;white-space:nowrap;}
  .card .actions{display:flex;gap:8px;margin-top:12px;}
  .card .actions button{
    font-size:11.5px;border:1px solid var(--line);background:var(--surface-2);
    padding:6px 12px;cursor:pointer;font-family:'Manrope';font-weight:700;color:var(--ink);
    border-radius:999px;transition:background .15s ease;
  }
  .card .actions button:hover{background:var(--line);}
  .card .actions button.danger{color:var(--red);border-color:var(--red-tint);background:var(--red-tint);}
  .card .actions button.danger:hover{background:#f5d4d4;}
  .card .actions button.primary{color:var(--green);border-color:var(--green-tint);background:var(--green-tint);}

  form.form-block{
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px;margin-bottom:18px;background:var(--surface-2);
  }
  form.form-block .field{margin-bottom:12px;}
  form.form-block label{
    display:block;font-size:11.5px;text-transform:none;color:var(--ink-soft);
    margin-bottom:5px;font-weight:700;
  }
  form.form-block input, form.form-block select{
    width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);
    background:#fff;font-family:'Manrope';font-size:14px;color:var(--ink);
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  form.form-block input:focus, form.form-block select:focus{
    outline:none;border-color:var(--green);box-shadow:0 0 0 3px var(--green-tint);
  }
  form.form-block .field-row{display:flex;gap:10px;}
  form.form-block .field-row .field{flex:1;}
  .pass-wrap{position:relative;}
  .pass-wrap input{padding-right:42px;}
  .pass-wrap .eye-btn{
    position:absolute;right:4px;top:50%;transform:translateY(-50%);
    background:none;border:none;cursor:pointer;color:var(--ink-faint);
    padding:6px;display:flex;align-items:center;justify-content:center;
    border-radius:8px;transition:color .15s ease, background .15s ease;
  }
  .pass-wrap .eye-btn:hover{color:var(--ink-soft);background:var(--surface-2);}

  .img-preview{
    width:64px;height:64px;object-fit:cover;border-radius:var(--radius-sm);
    border:1px solid var(--line);cursor:pointer;flex-shrink:0;background:var(--surface-2);
  }
  .img-thumb{
    width:44px;height:44px;object-fit:cover;border-radius:10px;
    border:1px solid var(--line);cursor:pointer;flex-shrink:0;margin-right:10px;
  }
  .img-thumb-sm{width:32px;height:32px;margin-right:0;border-radius:8px;}
  .img-thumb-empty{
    display:flex;align-items:center;justify-content:center;background:var(--surface-2);
    font-size:18px;cursor:default;
  }
  .card .row-top{align-items:center;}
  .lightbox-overlay{
    position:fixed;inset:0;background:rgba(15,17,13,0.85);
    display:flex;align-items:center;justify-content:center;
    z-index:100;padding:24px;cursor:zoom-out;
  }
  .lightbox-overlay img{
    max-width:92vw;max-height:85vh;border-radius:var(--radius);
    box-shadow:var(--shadow-lg);
  }
  .modal-box{
    background:#fff;border-radius:var(--radius);padding:22px;
    width:90%;max-width:340px;box-shadow:var(--shadow-lg);cursor:default;
  }
  .modal-box h3{margin:0 0 6px;font-size:16px;color:var(--ink);}
  .btn{
    display:inline-block;padding:11px 18px;background:var(--green);color:#fff;
    border:none;border-radius:999px;cursor:pointer;font-family:'Manrope';font-weight:800;font-size:13.5px;
    box-shadow:var(--shadow-sm);transition:transform .1s ease, box-shadow .15s ease, background .15s ease;
  }
  .btn:hover{background:var(--green-dark);box-shadow:var(--shadow-md);}
  .btn:active{transform:scale(0.98);}
  .btn.secondary{background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:none;}
  .btn.secondary:hover{background:var(--surface-2);}
  .btn.warn{background:var(--red);}
  .btn.warn:hover{background:#b53535;}
  .btn:disabled{opacity:0.4;cursor:not-allowed;transform:none;box-shadow:none;}
  .btn:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible{
    outline:2px solid var(--mango);outline-offset:2px;
  }

  .empty{
    padding:34px 18px;text-align:center;color:var(--ink-soft);
    border:1.5px dashed var(--line);border-radius:var(--radius);font-size:13.5px;
    background:var(--surface-2);
  }

  .total-strip{
    position:sticky;bottom:14px;left:0;right:0;
    background:linear-gradient(135deg,var(--green) 0%,var(--green-dark) 100%);
    color:#fff;border-radius:var(--radius);
    padding:16px 20px;margin:20px 0 -70px;
    display:flex;justify-content:space-between;align-items:center;
    box-shadow:var(--shadow-lg);
  }
  .total-strip .lbl{font-size:12px;opacity:0.8;}
  .total-strip .val{font-size:23px;font-weight:800;letter-spacing:-0.3px;}

  table.receipt-table{width:100%;border-collapse:collapse;margin-top:10px;}
  table.receipt-table th{
    text-align:left;font-size:10.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:0.4px;
    border-bottom:1px solid var(--line);padding:6px 4px 8px;font-weight:700;
  }
  table.receipt-table td{
    font-size:13px;padding:10px 4px;border-bottom:1px solid var(--line);
    vertical-align:middle;
  }
  table.receipt-table td.qtd input{width:56px;padding:6px;border:1px solid var(--line);border-radius:8px;text-align:center;}
  table.receipt-table td.num{white-space:nowrap;font-weight:700;}
  table.receipt-table td .rm{background:var(--red-tint);border:none;color:var(--red);cursor:pointer;font-size:14px;padding:4px 8px;border-radius:999px;line-height:1;}
  .pego-cell{width:28px;padding-right:0;}
  .chk-pego{width:19px;height:19px;accent-color:var(--green);cursor:pointer;}
  tr.item-pego td{opacity:0.45;}
  tr.item-pego .title, tr.item-pego{text-decoration:none;}
  tr.item-pego td:nth-child(2) > div > div{text-decoration:line-through;}

  .pill{
    display:inline-block;padding:3px 10px;border:1px solid var(--line);border-radius:999px;
    font-size:10.5px;color:var(--ink-soft);margin-right:4px;background:var(--surface-2);
  }

  .qr-box{
    border:1.5px dashed var(--line);border-radius:var(--radius);padding:20px;text-align:center;margin-bottom:16px;
    background:var(--surface-2);
  }
  video#qr-video{width:100%;max-width:400px;border-radius:var(--radius-sm);margin-top:12px;box-shadow:var(--shadow-md);}
  .qr-result{
    border:1px solid var(--green-tint);background:var(--green-tint);border-radius:var(--radius-sm);padding:14px;font-size:12.5px;
    word-break:break-all;margin-top:10px;
  }
  .notice{
    font-size:11.5px;color:var(--ink-soft);background:var(--mango-tint);border-radius:var(--radius-sm);
    border-left:3px solid var(--mango);padding:10px 12px;margin-top:8px;line-height:1.5;
  }
  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:10px 18px;font-size:12.5px;
    border-radius:999px;z-index:50;max-width:90%;text-align:center;box-shadow:var(--shadow-lg);
  }
  .install-bar{
    background:var(--mango-tint);color:var(--ink);padding:10px 18px;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    font-size:12px;border-bottom:1px solid var(--line);
  }
  .install-bar b{font-weight:800;}
  .install-bar .btn{background:var(--mango);color:#fff;box-shadow:none;padding:6px 14px;}
  .install-bar .linkbtn{color:var(--ink-soft);text-decoration:underline;}
</style>
</head>
<body>
<div id="app">
  <header class="receipt-head">
    <div class="header-inner">
      <h1>Feira do Mês</h1>
      <div class="sub">Compras compartilhadas · Região Metropolitana do Recife</div>
      <div class="userbar" id="userbar"></div>
    </div>
  </header>
  <div id="install-bar" class="install-bar" style="display:none"></div>
  <nav id="tabs"></nav>
  <main id="view"></main>
</div>

<script>
/* ---------------------------------------------------------
   Utilidades
--------------------------------------------------------- */
const $ = sel => document.querySelector(sel);
const fmtBRL = n => (Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function esc(s){ return String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg){
  const t=document.createElement('div');t.className='toast';t.textContent=msg;
  document.body.appendChild(t);setTimeout(()=>t.remove(),2200);
}

/* Conexão com o Supabase (projeto "liviocharlles-tech's Project", schema "feira") */
const SUPABASE_URL = 'https://wzfstallegpihgihiefg.supabase.co';
const SUPABASE_KEY = 'sb_publishable_TcrH8oRXCNM3x_AMbK9MPA_p9Mt4nRn';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function mensagemAmigavelErro(msg){
  if(!msg) return 'falha desconhecida';
  if(msg.includes('LIMITE_USUARIOS')) return 'Limite de usuários do plano atual atingido. Faça upgrade para o Premium para adicionar mais pessoas.';
  if(msg.includes('LIMITE_COMPRAS')) return 'Limite de compras do mês no plano atual atingido. Faça upgrade para o Premium para continuar.';
  return msg;
}
function dbErr(label, error){
  console.error(label, error);
  toast(mensagemAmigavelErro(error?.message).includes('Premium') ? mensagemAmigavelErro(error?.message) : 'Erro no banco (' + label + '): ' + mensagemAmigavelErro(error?.message));
}

const CATEGORIAS = ['Hortifruti','Açougue e Carnes','Laticínios e Frios','Padaria','Mercearia','Bebidas','Congelados','Limpeza','Higiene e Beleza','Pet','Outros'];
const UNIDADES = ['kg','g','L','ml','un','dz','pct','cx'];
const CIDADES_RMR = ['Recife','Olinda','Paulista','Jaboatão dos Guararapes','Camaragibe','São Lourenço da Mata','Cabo de Santo Agostinho','Igarassu','Abreu e Lima','Ipojuca','Moreno','Araçoiaba','Itapissuma','Itamaracá'];

/* ---------------------------------------------------------
   Estado
--------------------------------------------------------- */
let state = {
  tab: 'compra',
  usuarios: [],
  mercados: [],
  produtos: [],
  compraAtual: null,   // {id, mercadoId, criadoEm, itens:[], status}
  historico: [],
  authUser: null,       // sessão do Supabase Auth (auth.users)
  authMode: 'entrar',   // 'entrar' | 'cadastro'
  modoOrganizacao: 'criar', // 'criar' | 'entrar' — usado na tela de completar cadastro
  sessionUser: null,    // linha correspondente em feira.usuarios
  organizacao: null,    // linha correspondente em feira.organizacoes
  organizacaoDebug: null,
  editing: {mercado:null, produto:null, usuario:null},
  importadosNota: null,
  importadosSelecionados: [],
  mostrarFormMercado: false,
  mostrarFormProduto: false,
  detalheHistoricoId: null,
};

async function loadAll(){
  const [u, m, p] = await Promise.all([
    sb.from('feira_usuarios').select('*').order('criado_em'),
    sb.from('feira_mercados').select('*').order('nome'),
    sb.from('feira_produtos').select('*').order('nome'),
  ]);
  if(u.error) dbErr('usuarios', u.error); else state.usuarios = u.data.map(mapUsuario);
  if(m.error) dbErr('mercados', m.error); else state.mercados = m.data.map(mapMercado);
  if(p.error) dbErr('produtos', p.error); else state.produtos = p.data.map(mapProduto);

  const compraAberta = await sb.from('feira_compras').select('*').eq('status','aberta').order('criado_em',{ascending:false}).limit(1);
  if(compraAberta.error){ dbErr('compra atual', compraAberta.error); }
  else if(compraAberta.data.length){
    const c = compraAberta.data[0];
    const itens = await sb.from('feira_itens_compra').select('*').eq('compra_id', c.id).order('criado_em');
    const pres = await sb.from('feira_presenca').select('*').eq('compra_id', c.id);
    const agora = Date.now();
    const presencas = (pres.data||[])
      .filter(p => agora - new Date(p.atualizado_em).getTime() < 20000) // considera "ativo agora" nos últimos 20s
      .map(p => ({usuarioId:p.usuario_id, nome:p.nome}));
    state.compraAtual = {
      id:c.id, mercadoId:c.mercado_id, criadoEm:c.criado_em, status:c.status,
      itens: (itens.data||[]).map(mapItem), presencas
    };
  } else {
    state.compraAtual = null;
  }

  const hist = await sb.from('feira_compras').select('*, feira_mercados(nome,cor,imagem_url)').eq('status','finalizada').order('finalizada_em',{ascending:false}).limit(50);
  if(hist.error){ dbErr('histórico', hist.error); state.historico = []; }
  else {
    state.historico = await Promise.all(hist.data.map(async c=>{
      const itens = await sb.from('feira_itens_compra').select('*').eq('compra_id', c.id);
      const mapped = (itens.data||[]).map(mapItem);
      return {
        id:c.id, mercadoId:c.mercado_id, mercadoNome:(c.feira_mercados&&c.feira_mercados.nome)||'—',
        mercadoCor:(c.feira_mercados&&c.feira_mercados.cor)||null, mercadoImagem:(c.feira_mercados&&c.feira_mercados.imagem_url)||null,
        criadoEm:c.criado_em, finalizadaEm:c.finalizada_em, itens:mapped,
        total: mapped.reduce((s,it)=>s+(it.pego && it.precoReal!==null ? it.precoReal : it.precoUnit)*it.quantidade,0)
      };
    }));
  }
}
function mapUsuario(u){ return {id:u.id, nome:u.nome, admin:u.admin}; }
function mapMercado(m){ return {id:m.id, nome:m.nome, bairro:m.bairro, cidade:m.cidade, imagemUrl:m.imagem_url, cor:m.cor}; }
function mapProduto(p){ return {id:p.id, nome:p.nome, categoria:p.categoria, unidade:p.unidade, preco:Number(p.preco), imagemUrl:p.imagem_url}; }
function mapItem(it){ return {id:it.id, produtoId:it.produto_id, nome:it.nome, unidade:it.unidade, precoUnit:Number(it.preco_unit), quantidade:Number(it.quantidade), adicionadoPor:it.adicionado_por, imagemUrl:it.imagem_url, pego:!!it.pego, precoReal: it.preco_real===null||it.preco_real===undefined ? null : Number(it.preco_real)}; }

/* ---------------------------------------------------------
   Bootstrap / render loop
--------------------------------------------------------- */
async function enviarPresenca(){
  if(state.tab!=='compra' || !state.compraAtual || !state.sessionUser) return;
  // atualização otimista: já mostra a si mesmo na lista, sem esperar a resposta do banco
  if(!state.compraAtual.presencas.some(p=>p.usuarioId===state.sessionUser.id)){
    state.compraAtual.presencas.push({usuarioId: state.sessionUser.id, nome: state.sessionUser.nome});
  }
  try{
    await sb.from('feira_presenca').upsert({
      usuario_id: state.sessionUser.id, compra_id: state.compraAtual.id,
      nome: state.sessionUser.nome, atualizado_em: new Date().toISOString()
    });
  }catch(err){ /* silencioso — presença é um "nice to have", não trava o app */ }
}

async function init(){
  const {data} = await sb.auth.getSession();
  if(data.session){
    state.authUser = data.session.user;
    await loadAll();
    await checarPerfil();
  }
  enviarPresenca();
  render();
  setInterval(async ()=>{
    if(!state.authUser) return;
    enviarPresenca(); // sinaliza "comprando agora" mesmo se a tela não for redesenhada neste ciclo
    const ae = document.activeElement;
    const editando = ae && ['INPUT','SELECT','TEXTAREA'].includes(ae.tagName) && document.getElementById('app').contains(ae);
    if(editando) return; // não atualiza a tela enquanto alguém está digitando, para não apagar o que foi escrito
    if(state.tab === 'qr') return; // não redesenha a aba de QR: apagaria o resultado lido e cortaria a câmera aberta
    if(temSubtelaAberta()) return; // não redesenha enquanto um formulário (produto, mercado, importação) está aberto
    const algumaListaAberta = Array.from(document.querySelectorAll('.picker-list')).some(el => el.style.display !== 'none' && el.offsetParent !== null);
    if(algumaListaAberta) return; // não redesenha enquanto a lista de seleção está aberta
    await loadAll();
    render(true);
  }, 4000);
}

function render(silent){
  renderUserbar();
  renderTabs();
  if(!state.sessionUser || state.authMode==='nova-senha'){
    renderLogin();
    return;
  }
  const view = $('#view');
  view.innerHTML = `<div id="back-bar"></div><div id="tab-content"></div>`;
  renderBackBar();
  const content = $('#tab-content');
  switch(state.tab){
    case 'compra': renderCompra(content); break;
    case 'mercados': renderMercados(content); break;
    case 'produtos': renderProdutos(content); break;
    case 'usuarios': renderUsuarios(content); break;
    case 'historico': renderHistorico(content); break;
    case 'qr': renderQR(content); break;
    default: renderCompra(content);
  }
}
function temSubtelaAberta(){
  if(state.tab==='mercados' && (state.mostrarFormMercado || state.editing.mercado)) return true;
  if(state.tab==='produtos' && (state.mostrarFormProduto || state.editing.produto)) return true;
  if(state.tab==='qr' && state.importadosNota) return true;
  if(state.tab==='historico' && state.detalheHistoricoId) return true;
  return false;
}
function voltar(){
  if(state.tab==='qr' && state.importadosNota){ state.importadosNota=null; state.importadosSelecionados=[]; render(); return; }
  if(state.tab==='mercados' && (state.mostrarFormMercado || state.editing.mercado)){ cancelarEdicaoMercado(); return; }
  if(state.tab==='produtos' && (state.mostrarFormProduto || state.editing.produto)){ cancelarEdicaoProduto(); return; }
  if(state.tab==='historico' && state.detalheHistoricoId){ state.detalheHistoricoId=null; render(); return; }
  setTab('compra');
}
function renderBackBar(){
  const bar = $('#back-bar');
  if(!bar) return;
  const mostrar = temSubtelaAberta() || state.tab !== 'compra';
  bar.innerHTML = mostrar ? `<button class="back-btn" onclick="voltar()">← Voltar</button>` : '';
}

function setTab(t){
  if(state.tab === 'qr' && t !== 'qr') pararCamera();
  state.tab = t;
  enviarPresenca();
  render();
}

function renderTabs(){

function campoSenha(id, placeholder){
  return `<div class="pass-wrap">
    <input required type="password" minlength="6" id="${id}" placeholder="${placeholder}">
    <button type="button" class="eye-btn" onclick="toggleSenha('${id}', this)" aria-label="Mostrar senha">${eyeIconSVG(false)}</button>
  </div>`;
}
function eyeIconSVG(open){
  return open
    ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.4 18.4 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>'
    : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
}
function toggleSenha(id, btn){
  const input = document.getElementById(id);
  const showing = input.type === 'text';
  input.type = showing ? 'password' : 'text';
  btn.innerHTML = eyeIconSVG(!showing);
  btn.setAttribute('aria-label', !showing ? 'Ocultar senha' : 'Mostrar senha');
}

function renderLogin(){

      </form>

    return;
  }

  // Caso 1: pediu para recuperar a senha

    view.innerHTML = `

      <p class="section-hint">Informe o e-mail da sua conta. Vamos enviar um link para você criar uma nova senha.</p>

      </form>
      <button class="linkbtn" onclick="state.authMode='entrar'; render();">Voltar para entrar</button>
    `;

  }

  // Caso 2: sem sessão de conta nenhuma -> entrar ou criar conta
  if(!state.authUser){
    view.innerHTML = `
      <h2 class="section-title">${state.authMode==='cadastro'?'Criar conta':'Entrar'}</h2>
      <p class="section-hint">Acesso com e-mail e senha reais (Supabase Auth). Só quem tiver uma conta cadastrada e liberada pelo administrador consegue ver ou alterar os dados.</p>
      <form class="form-block" onsubmit="return ${state.authMode==='cadastro'?'criarConta(event)':'entrar(event)'}">
        <div class="field"><label>E-mail</label><input required type="email" id="au-email" placeholder="voce@exemplo.com"></div>
        <div class="field"><label>Senha</label>${campoSenha('au-senha','mínimo 6 caracteres')}</div>
        <button class="btn" type="submit">${state.authMode==='cadastro'?'Criar conta':'Entrar'}</button>
      </form>

        <button class="linkbtn" onclick="alternarModoAuth()">${state.authMode==='cadastro'?'Já tenho conta, quero entrar':'Ainda não tenho conta, quero me cadastrar'}</button>
        ${state.authMode!=='cadastro' ? `<button class="linkbtn" onclick="state.authMode='recuperar'; render();">Esqueceu a senha?</button>` : ''}
      </div>
      <div class="notice">${state.authMode==='cadastro'
        ? 'Depois de criar a conta, o Supabase pode pedir confirmação por e-mail antes do primeiro acesso — confira sua caixa de entrada (e o spam).'
        : 'Esqueceu a senha? Use o link acima — vamos te mandar um e-mail para redefinir.'}</div>
    `;
    return;
  }

  // Caso 3: tem conta autenticada, mas ainda não completou o cadastro (nome + organização) no app
  const modoOrg = state.modoOrganizacao || 'criar';

    <h2 class="section-title">Complete seu cadastro</h2>
    <p class="section-hint">Sua conta (${esc(state.authUser.email)}) está autenticada.</p>
    <form class="form-block" onsubmit="return completarCadastro(event)">
      <div class="field"><label>Seu nome</label><input required id="cc-nome" placeholder="Ex.: Lívio"></div>
      <div class="field-row" style="margin-bottom:12px">
        <button type="button" class="btn ${modoOrg==='criar'?'':'secondary'}" style="flex:1" onclick="state.modoOrganizacao='criar'; render();">Criar organização</button>
        <button type="button" class="btn ${modoOrg==='entrar'?'':'secondary'}" style="flex:1" onclick="state.modoOrganizacao='entrar'; render();">Tenho um código</button>

        <div class="notice">Você vira administrador dessa organização e poderá convidar outras pessoas depois, na aba Usuários.</div>
      ` : `

function alternarModoAuth(){ state.authMode = state.authMode==='cadastro' ? 'entrar' : 'cadastro'; render(); }

async function criarConta(e){
  e.preventDefault();
  const email = $('#au-email').value.trim();
  const senha = $('#au-senha').value;
  const {data, error} = await sb.auth.signUp({email, password: senha});
  if(error){ dbErr('criar conta', error); return false; }
  if(!data.session){
    toast('Conta criada! Confirme seu e-mail e depois entre normalmente.');
    state.authMode='entrar';
    render();
    return false;
  }
  state.authUser = data.user;
  render();
  return false;
}
async function entrar(e){
  e.preventDefault();
  const email = $('#au-email').value.trim();
  const senha = $('#au-senha').value;
  const {data, error} = await sb.auth.signInWithPassword({email, password: senha});
  if(error){ dbErr('entrar', error); return false; }
  state.authUser = data.user;
  await checarPerfil();
  render();
  return false;
}
async function recuperarSenha(e){
  e.preventDefault();
  const email = $('#rc-email').value.trim();
  const {error} = await sb.auth.resetPasswordForEmail(email, {
    redirectTo: window.location.origin + window.location.pathname
  });
  if(error){ dbErr('recuperar senha', error); return false; }
  toast('Se esse e-mail estiver cadastrado, o link de recuperação já foi enviado.');
  state.authMode = 'entrar';
  render();
  return false;
}
async function definirNovaSenha(e){
  e.preventDefault();
  const senha = $('#ns-senha').value;
  const {error} = await sb.auth.updateUser({password: senha});
  if(error){ dbErr('definir nova senha', error); return false; }
  toast('Senha atualizada com sucesso!');
  state.authMode = 'entrar';
  await checarPerfil();
  render();
  return false;
}
async function completarCadastro(e){
  e.preventDefault();
  const nome = $('#cc-nome').value.trim();
  if(!nome) return false;
  const modoOrg = state.modoOrganizacao || 'criar';
  let organizacaoId;

  if(modoOrg==='criar'){
    const nomeOrg = $('#cc-org-nome').value.trim();
    if(!nomeOrg) return false;
    organizacaoId = crypto.randomUUID(); // gerado no cliente pra não depender de ler de volta (RLS só libera leitura após o cadastro do usuário)
    const {error: errOrg} = await sb.from('feira_organizacoes').insert({id: organizacaoId, nome: nomeOrg});
    if(errOrg){ dbErr('criar organização', errOrg); return false; }
  } else {
    const codigo = $('#cc-org-codigo').value.trim().toLowerCase();
    if(!codigo) return false;
    const {data: orgs, error: errBusca} = await sb.rpc('buscar_organizacao_por_convite', {p_codigo: codigo});
    if(errBusca){ dbErr('buscar organização', errBusca); return false; }
    if(!orgs || orgs.length===0){ toast('Código de convite não encontrado. Confira com o administrador.'); return false; }
    organizacaoId = orgs[0].id;
  }

  const {data, error} = await sb.from('feira_usuarios').insert({id: state.authUser.id, nome, organizacao_id: organizacaoId, admin: modoOrg==='criar'}).select().single();
  if(error){ dbErr('completar cadastro', error); return false; }
  await checarPerfil();
  await loadAll();
  render();
  return false;
}
async function checarPerfil(){
  if(!state.authUser){ state.sessionUser=null; state.organizacao=null; return; }
  const {data, error} = await sb.from('feira_usuarios').select('*').eq('id', state.authUser.id).maybeSingle();
  if(error){ dbErr('carregar perfil', error); return; }
  state.sessionUser = data ? mapUsuario(data) : null;
  if(data){
    const org = await sb.from('feira_organizacoes').select('*').eq('id', data.organizacao_id).maybeSingle();
    if(org.error){ state.organizacaoDebug = 'Erro: ' + org.error.message; }
    else if(!org.data){ state.organizacaoDebug = 'Nenhuma organização encontrada com id ' + data.organizacao_id; }
    else { state.organizacaoDebug = null; }
    state.organizacao = org.data || null;
  }
}
sb.auth.onAuthStateChange((event, session)=>{
  if(event === 'PASSWORD_RECOVERY'){
    state.authUser = session.user;
    state.authMode = 'nova-senha';
    render();
  }
});

function normalizarTexto(s){
  return (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
}
async function buscarMercadoInternet(){
  const nome = $('#mc-nome').value.trim();
  const status = $('#mc-busca-status');
  if(!nome){ toast('Digite o nome do mercado primeiro.'); return; }
  status.textContent = 'Buscando endereço e logo...';

  let achouEndereco = false, achouLogo = false;

  // 1) Endereço via Nominatim (OpenStreetMap) — gratuito, sem chave
  try{
    const q = encodeURIComponent(nome + ', Pernambuco, Brasil');
    const r = await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&countrycodes=br&limit=1&q=${q}`);
    const arr = await r.json();
    if(arr && arr[0]){
      const addr = arr[0].address || {};
      const bairro = addr.suburb || addr.neighbourhood || addr.city_district || addr.quarter || '';
      const cidadeBruta = addr.city || addr.town || addr.municipality || '';
      if(bairro) $('#mc-bairro').value = bairro;
      const match = CIDADES_RMR.find(c => normalizarTexto(c) === normalizarTexto(cidadeBruta));
      if(match) $('#mc-cidade').value = match;
      achouEndereco = !!(bairro || match);
    }
  }catch(err){ /* segue sem endereço */ }

  // 2) Logo via Wikipédia (quando o mercado/rede tiver página) — gratuito, sem chave
  try{
    const t = encodeURIComponent(nome);
    const r = await fetch(`https://pt.wikipedia.org/w/api.php?action=query&format=json&origin=*&prop=pageimages&piprop=original&titles=${t}`);
    const data = await r.json();
    const pages = data.query && data.query.pages;
    const pagina = pages && Object.values(pages)[0];
    const imgUrl = pagina && pagina.original && pagina.original.source;
    if(imgUrl){
      $('#mc-imagem-url').value = imgUrl;
      atualizarPreviewImagemMercado(imgUrl);
      achouLogo = true;
    }
  }catch(err){ /* segue sem logo */ }

  if(achouEndereco && achouLogo) status.textContent = 'Endereço e logo encontrados — confira antes de salvar.';
  else if(achouEndereco) status.textContent = 'Endereço encontrado. Logo não encontrada — tente "Procurar logo" ou envie uma foto.';
  else if(achouLogo) status.textContent = 'Logo encontrada. Endereço não encontrado — preencha bairro/cidade manualmente.';
  else status.textContent = 'Não encontrei nada automaticamente — preencha manualmente ou tente "Procurar logo".';
}
function atualizarPreviewImagemMercado(url){
  const img = $('#mc-imagem-preview');
  if(!img) return;
  if(url){ img.src = url; img.style.display='block'; extrairCorDominante(url); }
  else { img.removeAttribute('src'); img.style.display='none'; }
}
async function onSelecionarImagemMercado(e){
  const file = e.target.files[0];
  if(!file) return;
  const status = $('#mc-imagem-status');

function extrairCorDominante(url){
  const hint = $('#mc-cor-hint');
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = () => {
    try{
      const c = document.createElement('canvas');
      const w = c.width = 32, h = c.height = 32;
      const ctx = c.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      const data = ctx.getImageData(0,0,w,h).data;
      let r=0,g=0,b=0,n=0;
      for(let i=0;i<data.length;i+=4){
        const rr=data[i], gg=data[i+1], bb=data[i+2], aa=data[i+3];
        // ignora pixels quase transparentes, quase brancos ou quase pretos (fundo, não a "cor" da marca)
        if(aa<128) continue;
        const lum = (rr+gg+bb)/3;
        if(lum>235 || lum<20) continue;
        r+=rr; g+=gg; b+=bb; n++;
      }
      if(n===0){ if(hint) hint.textContent='Não consegui identificar uma cor — escolha manualmente.'; return; }
      const hex = '#' + [r/n,g/n,b/n].map(v=>Math.round(v).toString(16).padStart(2,'0')).join('');
      const corInput = $('#mc-cor');
      if(corInput) corInput.value = hex;
      if(hint) hint.textContent = 'Cor extraída automaticamente da imagem — ajuste se quiser.';
    }catch(err){
      if(hint) hint.textContent = 'Não deu para ler as cores dessa imagem (restrição do site de origem) — escolha manualmente.';
    }
  };
  img.onerror = () => { if(hint) hint.textContent='Não consegui carregar essa imagem para ler a cor.'; };
  img.src = url;
}

  if(state.editing.produto){

    state.editing.produto = null;

      if(error){ dbErr('atualizar produto existente', error); return false; }
    } else {
      const {error} = await sb.from('feira_produtos').insert({nome,categoria,unidade,preco,imagem_url});
      if(error){ dbErr('cadastrar produto', error); return false; }
    }
  }
  await loadAll();
  state.mostrarFormProduto = false;
  render();
  return false;

function pickerItemHTML(item, ehProduto){

  const img = item.imagemUrl
    ? `<img src="${esc(item.imagemUrl)}" class="img-thumb img-thumb-sm" style="margin-right:0;">`
    : `<div class="img-thumb img-thumb-sm img-thumb-empty" style="margin-right:0;">${ehProduto?'🛒':'🏬'}</div>`;
  const meta = ehProduto ? `${fmtBRL(item.preco)}/${esc(item.unidade)}` : esc(item.cidade||'');
  return `${img}<span style="flex:1;text-align:left;"><b>${esc(item.nome)}</b><br><span class="meta">${meta}</span></span>`;
}
function togglePickerMercado(){

function selecionarMercadoPicker(id){

function togglePickerProduto(){

function filtrarPickerProduto(texto){

async function iniciarCompra(e){
  e.preventDefault();
  const mercadoId = $('#cp-mercado').value;
  if(!mercadoId){ toast('Selecione um mercado antes de continuar.'); return false; }
  const {error} = await sb.from('feira_compras').insert({mercado_id: mercadoId, status:'aberta'});
  if(error){ dbErr('iniciar compra', error); return false; }
  await loadAll();
  enviarPresenca();
  render();
  return false;
}
async function adicionarItem(e){
  e.preventDefault();
  const produtoId = $('#it-produto').value;
  if(!produtoId){ toast('Selecione um produto antes de adicionar.'); return false; }
  const qtd = parseFloat($('#it-qtd').value);
  const p = state.produtos.find(x=>x.id===produtoId);
  if(!p || !qtd || qtd<=0) return false;
  const precoDigitado = parseFloat($('#it-preco').value);
  const preco = (!isNaN(precoDigitado) && precoDigitado>=0) ? precoDigitado : p.preco;

  const {error} = await sb.from('feira_itens_compra').insert({
    compra_id: state.compraAtual.id, produto_id:p.id, nome:p.nome, unidade:p.unidade,
    preco_unit:preco, quantidade:qtd, adicionado_por: state.sessionUser.nome, imagem_url: p.imagemUrl || null
  });
  if(error){ dbErr('adicionar item', error); return false; }

  // se o preço usado for diferente do cadastrado, atualiza o cadastro do produto automaticamente
  if(preco !== p.preco){
    await sb.from('feira_produtos').update({preco, atualizado_em:new Date().toISOString()}).eq('id', p.id);
  }
  await loadAll();
  render();
  return false;
}
function confirmarModal(mensagem, opcoes){
  opcoes = opcoes || {};
  return new Promise(resolve=>{
    const overlay = document.createElement('div');
    overlay.className = 'lightbox-overlay';
    overlay.style.cursor = 'default';
    overlay.innerHTML = `
      <div class="modal-box" onclick="event.stopPropagation()">
        ${opcoes.titulo ? `<h3>${esc(opcoes.titulo)}</h3>` : ''}
        <p class="section-hint" style="margin:0 0 4px;white-space:pre-line">${esc(mensagem)}</p>
        <div style="display:flex;gap:8px;margin-top:16px;">
          <button type="button" class="btn secondary" id="modal-cancelar" style="flex:1">${esc(opcoes.textoCancelar||'Cancelar')}</button>
          <button type="button" class="btn ${opcoes.perigo?'warn':''}" id="modal-ok" style="flex:1">${esc(opcoes.textoOk||'OK')}</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    const finalizar = (v) => { overlay.remove(); resolve(v); };
    overlay.querySelector('#modal-ok').onclick = () => finalizar(true);
    overlay.querySelector('#modal-cancelar').onclick = () => finalizar(false);
    overlay.onclick = () => finalizar(false);
  });
}
function pedirValorReal(sugestao){
  return new Promise(resolve=>{
    const overlay = document.createElement('div');
    overlay.className = 'lightbox-overlay';
    overlay.style.cursor = 'default';
    overlay.innerHTML = `
      <div class="modal-box" onclick="event.stopPropagation()">
        <h3>Valor real do item</h3>
        <p class="section-hint" style="margin:0 0 12px">Qual foi o valor real por unidade? Deixe como está se não mudou.</p>
        <input type="number" step="0.01" min="0" id="modal-valor-real" value="${sugestao.toFixed(2)}" style="width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);font-size:16px;">
        <div style="display:flex;gap:8px;margin-top:16px;">
          <button type="button" class="btn secondary" id="modal-cancelar" style="flex:1">Cancelar</button>
          <button type="button" class="btn" id="modal-ok" style="flex:1">OK</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    const input = overlay.querySelector('#modal-valor-real');
    input.focus();
    input.select();
    const finalizar = (valor) => { overlay.remove(); resolve(valor); };
    overlay.querySelector('#modal-ok').onclick = () => finalizar(parseFloat(input.value));
    overlay.querySelector('#modal-cancelar').onclick = () => finalizar(null);
    overlay.onclick = () => finalizar(null);
    input.onkeydown = (e) => { if(e.key==='Enter'){ e.preventDefault(); finalizar(parseFloat(input.value)); } };
  });
}
async function togglePego(itemId, pego){
  const patch = {pego};
  if(pego){
    const it = state.compraAtual.itens.find(x=>x.id===itemId);
    const sugestao = it ? (it.precoReal ?? it.precoUnit) : 0;
    const valor = await pedirValorReal(sugestao);
    if(valor===null || isNaN(valor)){
      const chk = $('#chk-pego-'+itemId);
      if(chk) chk.checked = false; // cancelou: desmarca a caixinha de volta
      return;
    }
    patch.preco_real = valor;
  }
  const {error} = await sb.from('feira_itens_compra').update(patch).eq('id', itemId);
  if(error){ dbErr('marcar item', error); return; }
  await loadAll();
  render();
}
async function mudarQtd(itemId, val){
  const q = parseFloat(val);
  if(isNaN(q)||q<=0) { render(); return; }
  const {error} = await sb.from('feira_itens_compra').update({quantidade:q}).eq('id', itemId);
  if(error){ dbErr('alterar quantidade', error); return; }
  await loadAll();
  render();
}
async function removerItem(itemId){
  const {error} = await sb.from('feira_itens_compra').delete().eq('id', itemId);
  if(error){ dbErr('remover item', error); return; }
  await loadAll();
  render();
}
async function cancelarCompra(){
  if(!await confirmarModal('Cancelar esta compra? A lista atual será apagada para todos.', {perigo:true, textoOk:'Cancelar compra'})) return;
  const {error} = await sb.from('feira_compras').update({status:'cancelada'}).eq('id', state.compraAtual.id);
  if(error){ dbErr('cancelar compra', error); return; }
  await loadAll();
  render();
}
async function finalizarCompra(){
  if(!await confirmarModal('Finalizar e mover esta compra para o histórico?', {textoOk:'Finalizar'})) return;
  const {error} = await sb.from('feira_compras').update({status:'finalizada', finalizada_em:new Date().toISOString()}).eq('id', state.compraAtual.id);
  if(error){ dbErr('finalizar compra', error); return; }
  await loadAll();
  render();
  toast('Compra finalizada e movida para o histórico.');
}

function abrirDetalheHistorico(id){ state.detalheHistoricoId = id; render(); rolarParaTopo(); }

async function reutilizarCompra(id){
  if(state.compraAtual){ toast('Já existe uma compra em andamento. Finalize ou cancele antes de reutilizar esta.'); return; }
  const c = state.historico.find(x=>x.id===id);
  if(!c) return;
  if(!await confirmarModal(`Criar uma nova compra em "${c.mercadoNome}" com os mesmos ${c.itens.length} itens desta lista?`, {textoOk:'Criar'})) return;

  const {data:novaCompra, error} = await sb.from('feira_compras').insert({mercado_id:c.mercadoId, status:'aberta'}).select().single();
  if(error){ dbErr('reutilizar compra', error); return; }

  for(const it of c.itens){
    const produtoAtual = state.produtos.find(p=>p.id===it.produtoId);
    await sb.from('feira_itens_compra').insert({
      compra_id: novaCompra.id, produto_id: it.produtoId,
      nome: it.nome, unidade: it.unidade,
      preco_unit: produtoAtual ? produtoAtual.preco : it.precoUnit,
      quantidade: it.quantidade, adicionado_por: state.sessionUser.nome,
      imagem_url: (produtoAtual && produtoAtual.imagemUrl) || it.imagemUrl || null
    });
  }
  state.detalheHistoricoId = null;
  await loadAll();
  setTab('compra');
  toast('Compra recriada com os mesmos itens — confira os preços antes de sair às compras!');
}

async function excluirCompraHistorico(id){
  const c = state.historico.find(x=>x.id===id);
  if(!c) return;
  if(!await confirmarModal(`Excluir definitivamente a compra em "${c.mercadoNome}" de ${new Date(c.finalizadaEm).toLocaleDateString('pt-BR')}? Essa ação não pode ser desfeita.`, {perigo:true, textoOk:'Excluir'})) return;
  const {error} = await sb.from('feira_compras').delete().eq('id', id);
  if(error){ dbErr('excluir compra', error); return; }
  if(state.detalheHistoricoId===id) state.detalheHistoricoId = null;
  await loadAll();
  render();
  toast('Compra excluída do histórico.');
}

let qrStream = null, qrLoopId = null;

function renderQR(view){
  view.innerHTML = `

    <p class="section-hint">Aponte a câmera para o QR Code da nota (NFC-e) ou envie uma foto. O código traz o link e a chave de acesso da nota na Sefaz.</p>

    <div class="qr-box">
      <button class="btn" id="qr-btn-camera" onclick="iniciarCamera()">Usar câmera</button>
      <button class="btn secondary" id="qr-btn-parar" style="display:none" onclick="pararCamera()">Cancelar leitura</button>
      <input type="file" accept="image/*" id="qr-file" style="margin-top:10px" onchange="lerArquivoQR(event)">
      <div><video id="qr-video" playsinline muted autoplay style="display:none"></video></div>
      <canvas id="qr-canvas" style="display:none"></canvas>
    </div>

    <div id="qr-output"></div>

    <div class="notice">
      Sites de Sefaz normalmente bloqueiam o carregamento automático dos itens da nota por outros aplicativos (bloqueio de origem cruzada). Este leitor decodifica o QR Code e mostra o link e a chave de acesso — abra o link para conferir os produtos e cadastre-os manualmente na aba Produtos ou direto na Compra atual.
    </div>
  `;
}

function garantirJsQR(cb){
  if(window.jsQR){ cb(true); return; }
  const s = document.createElement('script');
  s.src = 'https://unpkg.com/jsqr@1.4.0/dist/jsQR.js';
  s.onload = () => cb(!!window.jsQR);
  s.onerror = () => cb(false);
  document.head.appendChild(s);
}

async function iniciarCamera(){
  if(!window.jsQR){
    toast('Carregando o leitor de QR Code...');
    const ok = await new Promise(res => garantirJsQR(res));
    if(!ok){ toast('Não consegui carregar o leitor de QR Code. Verifique sua internet e recarregue a página.'); return; }
  }
  // se já havia uma câmera aberta, encerra antes de pedir uma nova (evita "câmera em uso")
  pararCamera();

  const video = $('#qr-video');
  try{
    qrStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
  }catch(e){
    toast('Não foi possível acessar a câmera: '+e.message);
    return;
  }
  video.srcObject = qrStream;
  video.style.display = 'block';
  $('#qr-btn-camera').style.display = 'none';
  $('#qr-btn-parar').style.display = 'inline-block';
  try{ await video.play(); }catch(e){ /* alguns navegadores já tocam sozinhos */ }
  const canvas = $('#qr-canvas');
  const ctx = canvas.getContext('2d', {willReadFrequently:true});
  const inicioEscaneamento = Date.now();
  let avisoDado = false;
  let ultimoCandidato = null;
  let contagemCandidato = 0;
  function tick(){
    if(!qrStream) return; // câmera já foi parada
    if(video.readyState === video.HAVE_ENOUGH_DATA){
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const img = ctx.getImageData(0,0,canvas.width,canvas.height);
      let code = null;
      try{ code = jsQR(img.data, img.width, img.height); }catch(err){ code = null; }
      // ignora os primeiros ~1.5s (câmera ainda ajustando foco/exposição, mais sujeita a "achar" ruído)
      // e só aceita textos plausíveis de nota fiscal (link http ou uma chave de 44 dígitos)
      const tempoDecorrido = Date.now() - inicioEscaneamento;
      const pareceValido = code && (/^https?:\/\//i.test(code.data) || /\d{44}/.test(code.data));
      const candidatoValido = tempoDecorrido > 1500 && pareceValido ? code.data : null;
      if(candidatoValido && candidatoValido === ultimoCandidato){
        contagemCandidato++;
      } else {
        ultimoCandidato = candidatoValido;
        contagemCandidato = candidatoValido ? 1 : 0;
      }
      // só aceita depois de ler o MESMO código em 2 frames seguidos — evita fechar por leitura passageira/falsa
      if(candidatoValido && contagemCandidato >= 2){
        pararCamera();
        mostrarResultadoQR(code.data);
        return;
      }
    }
    if(!avisoDado && Date.now()-inicioEscaneamento > 9000){
      avisoDado = true;
      toast('Ainda não encontrei o QR Code — aproxime mais, melhore a luz ou tente enviar uma foto em vez da câmera.');
    }
    qrLoopId = requestAnimationFrame(tick);
  }
  tick();
}
function pararCamera(){
  if(qrLoopId) cancelAnimationFrame(qrLoopId);
  if(qrStream) qrStream.getTracks().forEach(t=>t.stop());
  qrStream=null; qrLoopId=null;
  const video = $('#qr-video');
  if(video){ video.style.display='none'; video.srcObject=null; }
  const btnCam = $('#qr-btn-camera'), btnParar = $('#qr-btn-parar');
  if(btnCam) btnCam.style.display='inline-block';
  if(btnParar) btnParar.style.display='none';
}
function lerArquivoQR(e){
  if(!window.jsQR){
    toast('Carregando o leitor de QR Code...');
    garantirJsQR(ok => {
      if(!ok){ toast('Não consegui carregar o leitor de QR Code. Verifique sua internet e recarregue a página.'); return; }
      processarArquivoQR(e);
    });
    return;
  }
  processarArquivoQR(e);
}
function processarArquivoQR(e){
  const file = e.target.files[0];
  if(!file) return;
  const img = new Image();
  const reader = new FileReader();
  reader.onerror = () => toast('Não foi possível abrir esse arquivo.');
  reader.onload = ev => {
    img.onerror = () => toast('Não consegui abrir essa imagem — se for uma foto de iPhone em formato HEIC, tente exportar como JPG/PNG antes, ou use "Usar câmera".');
    img.onload = () => {
      const canvas = $('#qr-canvas');
      canvas.width = img.width; canvas.height = img.height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img,0,0);
      const data = ctx.getImageData(0,0,canvas.width,canvas.height);
      const code = jsQR(data.data, data.width, data.height);
      if(code) mostrarResultadoQR(code.data);
      else toast('Não foi possível ler um QR Code nessa imagem. Tente recortar a foto deixando só o QR Code, com boa luz e foco.');
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}
function mostrarResultadoQR(texto){
  const chave = (texto.match(/[?&]p=(\d{44})/) || texto.match(/(\d{44})/) || [])[1];
  const ehSefaz = /^https?:\/\//i.test(texto) && /sefaz/i.test(texto);
  const out = $('#qr-output');
  out.innerHTML = `
    <div class="qr-result">
      <div><b>Conteúdo lido:</b></div>
      <div style="margin:6px 0">${esc(texto)}</div>
      ${chave ? `<div><b>Chave de acesso:</b> ${esc(chave)}</div>` : ''}
      ${/^https?:\/\//.test(texto) ? `<a href="${esc(texto)}" target="_blank" rel="noopener">Abrir nota em nova aba →</a>` : ''}
    </div>
    ${ehSefaz ? `
      <button class="btn" style="margin-top:10px" onclick="importarNotaFiscal('${esc(texto)}')">📥 Importar produtos desta nota</button>
      <div id="import-status" style="margin-top:8px"></div>
    ` : ''}
  `;
}

async function importarNotaFiscal(url){
  const status = $('#import-status');
  status.innerHTML = `<p class="section-hint" style="margin:0">Lendo a nota na Sefaz...</p>`;
  const {data, error} = await sb.functions.invoke('import-nfce', { body: { url } });
  if(error || !data || data.error){
    status.innerHTML = `<div class="notice">Não foi possível importar: ${esc((data&&data.error) || error?.message || 'erro desconhecido')}. Você ainda pode cadastrar manualmente pela aba Produtos.</div>`;
    return;
  }
  if(!data.itens || data.itens.length===0){
    status.innerHTML = `<div class="notice">A nota foi lida, mas nenhum produto foi encontrado nela.</div>`;
    return;
  }
  state.importadosNota = data;
  state.importadosSelecionados = data.itens.map((_,i)=>i);
  renderImportacaoNota();
}

function renderImportacaoNota(){
  const status = $('#import-status');
  if(!status) return;
  const d = state.importadosNota;
  const sel = state.importadosSelecionados;
  status.innerHTML = `
    <div class="card" style="margin-top:4px">
      <div class="title">${esc(d.mercado?.nome||'Mercado da nota')}</div>
      <div class="meta">${d.itens.length} produtos encontrados · total da nota ${fmtBRL(d.total)}</div>
    </div>
    <div style="max-height:340px;overflow-y:auto;margin:10px 0;">
      ${d.itens.map((it,i)=>`
        <label style="display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--line);">
          <input type="checkbox" class="chk-pego" ${sel.includes(i)?'checked':''} onchange="alternarSelecaoImportado(${i}, this.checked)">
          <span style="flex:1;font-size:13px;">${esc(it.nome)}<br><span class="meta" style="font-size:11px">${it.quantidade} ${esc(it.unidade)} · ${fmtBRL(it.valorUnitario)}/${esc(it.unidade)}</span></span>
        </label>
      `).join('')}
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <button class="btn" onclick="confirmarImportacao(false)">Cadastrar produtos selecionados</button>
      ${state.compraAtual ? `<button class="btn secondary" onclick="confirmarImportacao(true)">Cadastrar e adicionar à compra atual</button>` : ''}
    </div>
    <p class="section-hint" style="margin-top:8px">Produtos com o mesmo nome de algo já cadastrado terão só o preço atualizado; os demais entram como novos, na categoria "Outros" (edite depois se quiser).</p>
  `;
}
function alternarSelecaoImportado(i, marcado){
  const sel = state.importadosSelecionados;
  if(marcado && !sel.includes(i)) sel.push(i);
  if(!marcado) state.importadosSelecionados = sel.filter(x=>x!==i);
}
async function confirmarImportacao(adicionarNaCompra){
  const d = state.importadosNota;
  const selecionados = state.importadosSelecionados.map(i=>d.itens[i]);
  if(selecionados.length===0){ toast('Selecione ao menos um produto.'); return; }
  const status = $('#import-status');
  status.innerHTML = `<p class="section-hint" style="margin:0">Cadastrando...</p>`;

  for(const it of selecionados){
    const existente = state.produtos.find(p => p.nome.trim().toLowerCase() === it.nome.trim().toLowerCase());
    let produtoId;
    if(existente){
      await sb.from('feira_produtos').update({preco: it.valorUnitario, unidade: it.unidade, atualizado_em:new Date().toISOString()}).eq('id', existente.id);
      produtoId = existente.id;
    } else {
      const {data:novo, error} = await sb.from('feira_produtos').insert({
        nome: it.nome, categoria:'Outros', unidade: it.unidade, preco: it.valorUnitario
      }).select().single();
      if(error){ dbErr('cadastrar produto da nota', error); continue; }
      produtoId = novo.id;
    }
    if(adicionarNaCompra && state.compraAtual && produtoId){
      await sb.from('feira_itens_compra').insert({
        compra_id: state.compraAtual.id, produto_id: produtoId, nome: it.nome, unidade: it.unidade,
        preco_unit: it.valorUnitario, quantidade: it.quantidade || 1, adicionado_por: state.sessionUser.nome
      });
    }
  }
  await loadAll();
  state.importadosNota = null;
  state.importadosSelecionados = [];
  toast(`${selecionados.length} produto(s) cadastrado(s)${adicionarNaCompra?' e adicionados à compra':''}!`);
  render();
}

function abrirImagem(url){
  if(!url) return;
  const overlay = document.createElement('div');
  overlay.className = 'lightbox-overlay';
  overlay.innerHTML = `<img src="${esc(url)}">`;
  overlay.onclick = () => overlay.remove();
  document.body.appendChild(overlay);
}

/* ---------------------------------------------------------
   Instalar como app (PWA)
--------------------------------------------------------- */
let deferredInstallPrompt = null;
let installDismissed = false;

function isStandalone(){
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
}
function isIOS(){
  return /iphone|ipad|ipod/i.test(navigator.userAgent);
}
function renderInstallBar(){
  const el = document.getElementById('install-bar');
  if(!el) return;
  if(installDismissed || isStandalone()){ el.style.display='none'; el.innerHTML=''; return; }
  if(deferredInstallPrompt){
    el.style.display='flex';
    el.innerHTML = `<span>Instale o <b>Feira do Mês</b> na tela inicial do celular.</span>
      <span style="display:flex;gap:10px;align-items:center;white-space:nowrap">
        <button class="btn" style="padding:6px 12px" onclick="instalarApp()">Instalar</button>
        <button class="linkbtn" onclick="dismissInstallBar()">agora não</button>
      </span>`;
  } else if(isIOS()){
    el.style.display='flex';
    el.innerHTML = `<span>Para instalar: toque em <b>Compartilhar</b> e depois em <b>"Adicionar à Tela de Início"</b>.</span>
      <button class="linkbtn" onclick="dismissInstallBar()">ok</button>`;
  } else {
    el.style.display='none';
  }
}
function dismissInstallBar(){ installDismissed = true; renderInstallBar(); }
async function instalarApp(){
  if(!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice;
  deferredInstallPrompt = null;
  renderInstallBar();
}
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredInstallPrompt = e;
  renderInstallBar();
});
window.addEventListener('appinstalled', ()=>{
  deferredInstallPrompt = null;
  renderInstallBar();
});
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}

/* ---------------------------------------------------------
   Start
--------------------------------------------------------- */
init();
renderInstallBar();
</script>
